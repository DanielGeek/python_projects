<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Asteroids</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    /* Dark is the default theme; light overrides apply under [data-theme="light"],
       skin overrides come after the theme rules. */
    :root {
      color-scheme: dark;
      --page-bg: #000000;
      --frame: #222222;
      --frame-glow: none;
      --bar-bg: #1b1b1b;
      --bar-text: #e6e6e6;
      --bar-border: #5a5a5a;
      --focus: #00ffff;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --page-bg: #e4e4dc;
      --frame: #8a8a80;
      --bar-bg: #ffffff;
      --bar-text: #1a1a1a;
      --bar-border: #6b6b60;
      --focus: #005f80;
    }
    :root[data-skin="retro"] {
      --page-bg: #0a0600;
      --frame: #7a5200;
      --bar-bg: #241600;
      --bar-text: #ffb000;
      --bar-border: #b37b00;
      --focus: #ffe58a;
    }
    :root[data-skin="retro"][data-theme="light"] {
      --page-bg: #b9cc9a;
      --frame: #4a6a34;
      --bar-bg: #e3efd0;
      --bar-text: #1d3511;
      --bar-border: #3d5a2a;
      --focus: #0b4a2a;
    }
    :root[data-skin="neon"] {
      --page-bg: #020206;
      --frame: #00f0ff;
      --frame-glow: 0 0 14px rgba(0, 240, 255, 0.7), 0 0 34px rgba(255, 43, 214, 0.35);
      --bar-bg: #0a0a14;
      --bar-text: #e8ffff;
      --bar-border: #00b8c4;
      --focus: #ff2bd6;
    }
    /* The neon play area stays dark in both themes; only the page and the bar change. */
    :root[data-skin="neon"][data-theme="light"] {
      --page-bg: #cfd3e6;
      --frame: #00a3ad;
      --frame-glow: 0 0 14px rgba(0, 240, 255, 0.7), 0 0 34px rgba(255, 43, 214, 0.35);
      --bar-bg: #0a0a14;
      --bar-text: #e8ffff;
      --bar-border: #00b8c4;
      --focus: #ff2bd6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--page-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    canvas {
      display: block;
      border: 1px solid var(--frame);
      box-shadow: var(--frame-glow);
    }
    /* Fixed so the canvas keeps its size and position (no layout change). */
    .toolbar {
      position: fixed;
      left: 6px;
      bottom: 6px;
      display: flex;
      gap: 6px;
      align-items: center;
      font: 12px monospace;
      color: var(--bar-text);
    }
    .toolbar select,
    .toolbar button {
      font: inherit;
      color: var(--bar-text);
      background: var(--bar-bg);
      border: 1px solid var(--bar-border);
      border-radius: 3px;
      padding: 2px 6px;
      cursor: pointer;
    }
    .toolbar select:focus-visible,
    .toolbar button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="800" height="600"></canvas>
  <div class="toolbar">
    <select id="skin-select" aria-label="Visual skin"></select>
    <button id="theme-toggle" type="button" aria-pressed="false" aria-label="Light theme">
      <span id="theme-toggle-icon" aria-hidden="true">&#9728;</span>
      <span id="theme-toggle-text" aria-hidden="true">Light</span>
    </button>
  </div>
  <script src="../bridge.js" data-game="asteroids"></script>
  <script src="game.js"></script>
</body>
</html>
