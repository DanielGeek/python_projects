name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Triage issue with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowed-tools "Bash(gh issue *),Bash(gh label *),Read,Glob,Grep"'
          prompt: |
            Analyze issue #${{ github.event.issue.number }} of the repository ${{ github.repository }}.

            Issue title: ${{ github.event.issue.title }}

            Follow these steps in order:

            1. Read the full content of the issue:
               `gh issue view ${{ github.event.issue.number }}`

            2. Review the labels that already exist in the repo:
               `gh label list`

            3. Assign between 1 and 4 appropriate labels to the issue:
               `gh issue edit ${{ github.event.issue.number }} --add-label "<label>"`
               Suggested categories: bug, feature, enhancement, question, documentation,
               ui, gameplay, performance, refactor, good-first-issue, priority/high, priority/medium, priority/low.
               If a needed label does not exist, create it first:
               `gh label create "<name>" --color <hex> --description "<description>"`

            4. Explore the repository files that are relevant to the issue
               using the Read, Glob and Grep tools as needed.

            5. Post ONE diagnostic comment on the issue:
               `gh issue comment ${{ github.event.issue.number }} --body "<content>"`

               The content must be written in GitHub-compatible Markdown (GFM):
               use headings with `##`, lists with `-`, code blocks with triple backticks,
               bold with `**`, and file references as `path/file.js:42`.
               Do not use HTML or syntax that GitHub does not render in issue comments.

               The comment must have exactly this structure, in English:

               ## 🔍 Automatic diagnosis

               **Category:** <type: bug / feature / improvement / question / documentation>
               <2-4 lines describing the issue and its impact>

               ## 📁 Affected code area
               <list of relevant files, functions or constants with file:line references>

               ## 🧠 Root cause / technical analysis
               <technical explanation of why the problem happens or why the feature is missing>

               ## 🛠️ Proposed solution
               <numbered concrete implementation steps, stating which files to touch and what to change>

               ## ⚠️ Risks and considerations
               <possible regressions, edge cases, dependencies to keep in mind>

               ---
               *Diagnosis generated automatically by Claude. Verify before implementing.*

            Important notes:
            - If the issue is ambiguous or lacks information, ask for it in the comment instead of making things up.
            - If a previous Claude diagnostic comment already exists (case of an edited issue),
              edit that comment instead of creating a new one to avoid duplicates.
            - Be technical and precise: this diagnosis will be used directly as the basis for implementing the solution.
