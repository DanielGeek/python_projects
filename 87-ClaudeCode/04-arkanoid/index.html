<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkanoid</title>
  <link rel="icon" href="data:,">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #2b2b2b;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stage {
      position: relative;
    }
    canvas {
      display: block;
      background: #000;
    }
    #mute-indicator {
      position: absolute;
      top: 0;
      left: calc(100% + 12px);
      display: flex;
      align-items: center;
      gap: 6px;
      color: #c8c8c8;
      font: bold 14px monospace;
      pointer-events: none;
      user-select: none;
    }
    #mute-indicator svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #mute-indicator .icon-body {
      stroke: none;
    }
    #mute-indicator .waves,
    #mute-indicator .cross {
      fill: none;
    }
    #mute-indicator[data-muted="false"] .icon-off,
    #mute-indicator[data-muted="true"] .icon-on {
      display: none;
    }
    #mute-indicator .key-hint {
      border: 1px solid currentColor;
      border-radius: 4px;
      padding: 1px 6px;
    }
    #controls-guide {
      position: absolute;
      top: 40px;
      left: calc(100% + 12px);
      max-width: 100px;
      color: #c8c8c8;
      font: 12px monospace;
      pointer-events: none;
      user-select: none;
    }
    #controls-guide .control + .control {
      margin-top: 10px;
    }
    #controls-guide .control-label {
      display: block;
      margin-bottom: 4px;
    }
    #controls-guide .control-keys {
      display: block;
      line-height: 24px;
    }
    #controls-guide kbd {
      border: 1px solid currentColor;
      border-radius: 4px;
      padding: 1px 6px;
      margin-right: 2px;
      font: bold 14px monospace;
    }
    /* No free space beside the canvas (800 px + 2 * 84 px): fall back to the page corner. */
    @media (max-width: 968px) {
      #mute-indicator {
        position: fixed;
        top: 16px;
        right: 16px;
        left: auto;
      }
      #controls-guide {
        position: fixed;
        top: 56px;
        right: 16px;
        left: auto;
      }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="800" height="600"></canvas>
    <div id="mute-indicator" data-muted="false" role="img" aria-label="Sound on">
      <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true">
        <path class="icon-body" d="M3 9v6h4l5 4V5L7 9H3z"/>
        <path class="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>
      </svg>
      <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true">
        <path class="icon-body" d="M3 9v6h4l5 4V5L7 9H3z"/>
        <path class="cross" d="M16 9.5l5 5M21 9.5l-5 5"/>
      </svg>
      <span class="key-hint">M</span>
    </div>
    <div id="controls-guide" role="group" aria-label="Controls">
      <div class="control">
        <span class="control-label">Move</span>
        <span class="control-keys">
          <kbd>←</kbd><kbd>→</kbd> <kbd>A</kbd><kbd>D</kbd> <span class="control-or">or mouse</span>
        </span>
      </div>
      <div class="control">
        <span class="control-label">Launch</span>
        <span class="control-keys"><kbd>Space</kbd> <span class="control-or">or click</span></span>
      </div>
      <div class="control">
        <span class="control-label">Pause</span>
        <span class="control-keys"><kbd>P</kbd> <kbd>Esc</kbd></span>
      </div>
    </div>
  </div>
  <script src="assets/spritesheet.js"></script>
  <script src="levels.js"></script>
  <script src="game.js"></script>
</body>
</html>
