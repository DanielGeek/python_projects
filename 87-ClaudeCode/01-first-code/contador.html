<!DOCTYPE html>
<html>

<head>
    <title>Contador</title>
    <style>
        body {
            background: #2b2b2b;
            color: #f0f0f0;
        }

        button {
            background: #3d3d3d;
            color: #f0f0f0;
            border: 1px solid #777;
        }
    </style>
</head>

<body>
    <p id="contador">0</p>
    <button onclick="cambiar(-1)">-</button>
    <button onclick="cambiar(1)">+</button>

    <script>
        var valor = 0;
        function cambiar(n) {
            valor += n;
            document.getElementById("contador").textContent = valor;
        }
    </script>
</body>

</html>
