name: opencode

on:
  pull_request:
    paths:
      - '89-OpenCode-Projects/03-asteroids/**'

jobs:
  opencode:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/glm-5.3
          prompt: |
            Review this pull request, focusing on the changes under
            89-OpenCode-Projects/03-asteroids. Point out bugs, gameplay
            regressions and unclear code. Be concise.
