<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <!-- Background -->
  <rect width="800" height="500" rx="20" fill="url(#bg2)"/>
  
  <!-- Decorative circles -->
  <circle cx="680" cy="80" r="70" fill="rgba(255,255,255,0.1)"/>
  <circle cx="120" cy="420" r="90" fill="rgba(255,255,255,0.08)"/>
  
  <!-- Phone device -->
  <rect x="310" y="80" width="180" height="300" rx="24" fill="#fff" stroke="#E8D5C4" stroke-width="2"/>
  <rect x="325" y="110" width="150" height="240" rx="4" fill="#FFF5EE"/>
  
  <!-- Notch -->
  <rect x="370" y="88" width="60" height="12" rx="6" fill="#E8D5C4"/>
  
  <!-- Feed items on phone -->
  <!-- Item 1: Photo post -->
  <rect x="335" y="125" width="130" height="60" rx="8" fill="#F6A98E" opacity="0.3"/>
  <rect x="340" y="130" width="50" height="50" rx="6" fill="#F2937A"/>
  <circle cx="355" cy="147" r="6" fill="#fff" opacity="0.8"/>
  <path d="M343 170 L355 155 L370 165 L380 158 L385 170 Z" fill="#fff" opacity="0.6"/>
  <rect x="398" y="135" width="60" height="6" rx="3" fill="#D4A89A"/>
  <rect x="398" y="147" width="45" height="5" rx="2.5" fill="#E8D5C4"/>
  <rect x="398" y="158" width="52" height="5" rx="2.5" fill="#E8D5C4"/>
  
  <!-- Item 2: Activity -->
  <rect x="335" y="195" width="130" height="50" rx="8" fill="#EC7E62" opacity="0.2"/>
  <circle cx="360" cy="220" r="15" fill="#EC7E62"/>
  <path d="M355 220 L358 224 L366 215" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="385" y="210" width="70" height="6" rx="3" fill="#D4A89A"/>
  <rect x="385" y="222" width="55" height="5" rx="2.5" fill="#E8D5C4"/>
  
  <!-- Item 3: Nap time -->
  <rect x="335" y="255" width="130" height="50" rx="8" fill="#F4977E" opacity="0.2"/>
  <circle cx="360" cy="280" r="15" fill="#F4977E"/>
  <path d="M352 278 C352 274 356 272 360 275 C364 272 368 274 368 278 C368 283 360 288 360 288 C360 288 352 283 352 278Z" fill="#fff"/>
  <rect x="385" y="270" width="65" height="6" rx="3" fill="#D4A89A"/>
  <rect x="385" y="282" width="48" height="5" rx="2.5" fill="#E8D5C4"/>
  
  <!-- Live indicator -->
  <circle cx="530" cy="120" r="18" fill="#22C55E"/>
  <circle cx="530" cy="120" r="8" fill="#fff"/>
  <text x="560" y="125" fill="#fff" font-family="system-ui" font-weight="600" font-size="12">LIVE</text>
  
  <!-- Clock/time -->
  <circle cx="260" cy="180" r="30" fill="rgba(255,255,255,0.15)"/>
  <circle cx="260" cy="180" r="25" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
  <line x1="260" y1="180" x2="260" y2="163" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="260" y1="180" x2="273" y2="185" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Notification bell -->
  <circle cx="550" cy="350" r="20" fill="rgba(255,255,255,0.15)"/>
  <path d="M543 350 C543 343 546 340 550 340 C554 340 557 343 557 350 L557 355 L543 355 Z" fill="#fff" opacity="0.7"/>
  <circle cx="550" cy="358" r="2" fill="#fff" opacity="0.7"/>
  
  <!-- Text -->
  <text x="400" y="430" text-anchor="middle" fill="#fff" font-family="system-ui" font-weight="700" font-size="22">Real-Time Tracking</text>
  <text x="400" y="458" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="system-ui" font-size="14">See your child's day unfold, moment by moment</text>
  
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="800" y2="500">
      <stop offset="0%" stop-color="#F4977E"/>
      <stop offset="50%" stop-color="#F2937A"/>
      <stop offset="100%" stop-color="#EC7E62"/>
    </linearGradient>
  </defs>
</svg>
