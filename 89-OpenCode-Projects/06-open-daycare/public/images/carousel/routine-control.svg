<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <!-- Background -->
  <rect width="800" height="500" rx="20" fill="url(#bg3)"/>
  
  <!-- Decorative circles -->
  <circle cx="700" cy="420" r="100" fill="rgba(255,255,255,0.08)"/>
