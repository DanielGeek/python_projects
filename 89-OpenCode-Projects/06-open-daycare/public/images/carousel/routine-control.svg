  <rect x="342" y="304" width="85" height="7" rx="3.5" fill="#D4A89A"/>
  <rect x="342" y="317" width="65" height="5" rx="2.5" fill="#E8D5C4"/>
  <rect x="455" y="302" width="30" height="20" rx="10" fill="#FFC107" opacity="0.6"/>
  <text x="470" y="316" text-anchor="middle" fill="#fff" font-size="9">...</text>
  
  <!-- Decorative elements -->
  <path d="M180 250 L183 243 L186 250 L193 253 L186 256 L183 263 L180 256 L173 253 Z" fill="#FFD700" opacity="0.5"/>
  <path d="M620 150 L623 143 L626 150 L633 153 L626 156 L623 163 L620 156 L613 153 Z" fill="#FFD700" opacity="0.5"/>
  
