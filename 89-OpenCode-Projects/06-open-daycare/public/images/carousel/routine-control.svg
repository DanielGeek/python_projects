  <path d="M192 150 C192 144 196 140 200 143 C204 140 208 144 208 150 C208 156 200 162 200 162 C200 162 192 156 192 150Z" fill="#fff" opacity="0.6"/>
  
  <circle cx="600" cy="300" r="22" fill="rgba(255,255,255,0.15)"/>
  <circle cx="600" cy="296" r="6" fill="#fff" opacity="0.6"/>
  <path d="M590 310 C590 304 594 300 600 300 C606 300 610 304 610 310" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/>
  
