  <!-- Clipboard/schedule -->
  <rect x="280" y="100" width="240" height="280" rx="16" fill="#fff" stroke="#E8D5C4" stroke-width="2"/>
  
  <!-- Clipboard clip -->
  <rect x="360" y="88" width="80" height="24" rx="12" fill="#F2937A"/>
  <rect x="380" y="84" width="40" height="12" rx="6" fill="#EC7E62"/>
  
  <!-- Schedule items -->
  <!-- Morning -->
  <rect x="300" y="130" width="200" height="44" rx="8" fill="#FFF5EE"/>
  <circle cx="320" cy="152" r="12" fill="#F6A98E"/>
  <text x="318" y="156" text-anchor="middle" fill="#fff" font-size="10">☀</text>
  <rect x="342" y="142" width="80" height="7" rx="3.5" fill="#D4A89A"/>
  <rect x="342" y="155" width="55" height="5" rx="2.5" fill="#E8D5C4"/>
  <rect x="455" y="140" width="30" height="20" rx="10" fill="#22C55E"/>
  <path d="M464 148 L467 152 L475 145" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Meal -->
  <rect x="300" y="184" width="200" height="44" rx="8" fill="#FFF5EE"/>
  <circle cx="320" cy="206" r="12" fill="#EC7E62"/>
