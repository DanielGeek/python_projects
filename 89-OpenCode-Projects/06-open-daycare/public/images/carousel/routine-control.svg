  <text x="400" y="430" text-anchor="middle" fill="#fff" font-family="system-ui" font-weight="700" font-size="22">Routine Control</text>
  <text x="400" y="458" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="system-ui" font-size="14">Track meals, naps, activities and milestones</text>
  
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="800" y2="500">
      <stop offset="0%" stop-color="#EC7E62"/>
      <stop offset="50%" stop-color="#F2937A"/>
      <stop offset="100%" stop-color="#F6A98E"/>
    </linearGradient>
  </defs>
