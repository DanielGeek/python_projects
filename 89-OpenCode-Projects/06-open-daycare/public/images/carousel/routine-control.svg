  <rect x="342" y="196" width="90" height="7" rx="3.5" fill="#D4A89A"/>
  <rect x="342" y="209" width="60" height="5" rx="2.5" fill="#E8D5C4"/>
  <rect x="455" y="194" width="30" height="20" rx="10" fill="#22C55E"/>
  <path d="M464 202 L467 206 L475 199" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Nap -->
  <rect x="300" y="238" width="200" height="44" rx="8" fill="#FFF5EE"/>
  <circle cx="320" cy="260" r="12" fill="#F4977E"/>
  <text x="318" y="264" text-anchor="middle" fill="#fff" font-size="10">😴</text>
  <rect x="342" y="250" width="70" height="7" rx="3.5" fill="#D4A89A"/>
  <rect x="342" y="263" width="50" height="5" rx="2.5" fill="#E8D5C4"/>
